<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哲学流派框架 | Philosophy Framework Explorer</title>
    <link rel="stylesheet" href="css/framework.css">
</head>
<body>
    <div class="app">
        <!-- 顶部导航 -->
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-text">Philosophy Frameworks</span>
            </div>
            <nav class="topnav">
                <a href="index.html" class="nav-link">知识图谱</a>
                <button class="nav-link active" data-disc="mind">Philosophy of Mind</button>
                <button class="nav-link" data-disc="metaphysics">Metaphysics</button>
            </nav>
        </header>

        <!-- 主区 -->
        <main class="layout">
            <!-- 左侧：流派列表 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-head">
                    <h2 id="disc-title">Philosophy of Mind</h2>
                    <p id="disc-intro">简介摘要</p>
                </div>
                <div class="school-list" id="school-list"></div>
            </aside>

            <!-- 右侧：详情面板 -->
            <section class="content" id="content">
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon"></div>
                    <h2>选择左侧一个流派</h2>
                    <p>查看其划分依据、主要哲学家、观点与论证方式</p>
                </div>

                <div class="detail" id="detail" hidden>
                    <div class="detail-header">
                        <span class="school-badge" id="d-badge"></span>
                        <h1 id="d-name"></h1>
                    </div>

                    <div class="card">
                        <div class="card-title">划分依据</div>
                        <p class="card-body" id="d-base"></p>
                    </div>

                    <div class="card">
                        <div class="card-title">主要哲学家</div>
                        <ul class="philosopher-list" id="d-philosophers"></ul>
                    </div>

                    <div class="card">
                        <div class="card-title">核心观点</div>
                        <p class="card-body" id="d-view"></p>
                    </div>

                    <div class="card">
                        <div class="card-title">论证方式</div>
                        <div class="argument-list" id="d-arguments"></div>
                    </div>

                    <div class="card relations-card">
                        <div class="card-title">与其他流派的关系</div>
                        <div class="relations" id="d-relations"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/framework-data.js"></script>
    <script src="js/framework-explorer.js"></script>
</body>
</html>
